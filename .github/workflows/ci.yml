name: Build, test, and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options: [android, web]

permissions:
  contents: read

jobs:
  changes:
    name: Test CI routing and detect changes
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test change detection
        run: node --test scripts/ci/tests/*.test.mjs
      - name: Detect changed applications
        id: changes
        run: node scripts/ci/detect-changes.mjs

  android:
    name: Android tests and APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      AGAP_API_PROVIDER: ${{ vars.AGAP_API_PROVIDER || 'go' }}
      AGAP_API_URL: ${{ vars.AGAP_API_URL || 'http://10.0.2.2:8080/api/v1' }}
      AGAP_WS_URL: ${{ vars.AGAP_WS_URL || 'ws://10.0.2.2:8080/ws' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify hosted API variables for an on-demand release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$AGAP_API_PROVIDER" != cloudflare || "$AGAP_API_URL" != https://*/api/v1 ]]; then
            echo '::error::Set AGAP_API_PROVIDER=cloudflare and AGAP_API_URL to the public HTTPS Worker URL ending in /api/v1.'
            exit 1
          fi
      - name: Run unit tests and build debug APK
        # Override the developer's Windows Java path for the Linux runner.
        run: bash ./gradlew --no-daemon "-Dorg.gradle.java.home=$JAVA_HOME" :app:testDebugUnitTest :app:assembleDebug
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agap-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release-android:
    name: Publish Android GitHub release
    needs: android
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'android')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: android-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: agap-debug-${{ github.sha }}
          path: android-apk
      - name: Publish APK after successful tests and build
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_BUILD_RESULT: ${{ needs.android.result }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: node scripts/ci/publish-android-release.mjs

  web:
    name: Web tests and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && 'cloudflare' || (vars.AGAP_API_URL && vars.AGAP_API_PROVIDER) || 'go' }}
      VITE_API_BASE_URL: ${{ vars.AGAP_API_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build for the Netlify site root
        run: npm run build -- --base=/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    name: Promote web build to Netlify
    needs: web
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'web' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: netlify-production
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      AGAP_API_URL: ${{ vars.AGAP_API_URL }}
    steps:
      - name: Require Netlify and hosted API configuration
        run: |
          for key in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID AGAP_API_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing Actions setting $key. See functions/README.md."
              exit 1
            fi
          done
          if [[ "$AGAP_API_URL" != https://*/api/v1 ]]; then
            echo '::error::AGAP_API_URL must use HTTPS and end in /api/v1.'
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist
      - name: Publish tested Command Center
        run: npx --yes netlify-cli@23 deploy --prod --no-build --dir=web-dist --site "$NETLIFY_SITE_ID"
