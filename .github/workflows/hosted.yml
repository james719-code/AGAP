name: Hosted backend tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions ci
      - name: Stage the hosted API
        run: npm --prefix functions run prepare:deploy
      - name: Test PostgreSQL and Firestore
        run: npx --yes firebase-tools@15.15.0 emulators:exec --config functions/firebase/firebase.json --project demo-agap-switch --only firestore "npm --prefix functions test"
      - name: Validate the Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4.165.0 deploy --config functions/cloudflare/wrangler.gateway.toml --dry-run --outdir "$RUNNER_TEMP/agap-gateway-build"
