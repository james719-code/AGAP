name: Hosted backend tests
on:
  push:
    paths: ['functions/**', 'backend/internal/repository/sqlite/migrations/**', '.github/workflows/hosted.yml']
  pull_request:
    paths: ['functions/**', 'backend/internal/repository/sqlite/migrations/**', '.github/workflows/hosted.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions ci
      - name: Test PostgreSQL and Firestore
        run: npx --yes firebase-tools@15.15.0 emulators:exec --config functions/firebase/firebase.json --project demo-agap-switch --only firestore "npm --prefix functions test"
