# AGAP (Accelerated Geolocation-based Assistance and Protection) — nginx reverse proxy
# Place at: /etc/nginx/sites-available/agap
# Enable:  ln -s /etc/nginx/sites-available/agap /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;

    # Static files served directly by nginx (fast, no Go overhead)
    root /opt/agap/static;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # API proxy to Go backend
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for slow HDD writes
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health probe proxy to Go backend
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API & Database Explorer UI proxy to Go backend
    location /info {
        proxy_pass http://127.0.0.1:8081/info;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy to Go backend
    location /ws {
        proxy_pass http://127.0.0.1:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive timeouts for WebSocket telemetry stream
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: all non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for bandwidth savings
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/html;

    # Cache static assets (1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
